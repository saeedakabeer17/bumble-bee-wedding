function StatusBadge({ status }) {
  const key = (status || "").split(" (")[0].split(" —")[0].toUpperCase();
  const s = STATUS_STYLES[key] || STATUS_STYLES[status] || { bg: "#EEEEEC", text: "#65635C", border: "#DAD8D2" };

    <span className="inline-block px-2.5 py-1 rounded text-xs font-medium whitespace-nowrap" style={{ backgroundColor: s.bg, color: s.text, border: `1px solid ${s.border}` }}>

  MEDIUM: { bg: "#F3EEE4", text: "#8A6D3B" },

function PriorityBadge({ priority }) {

function Card({ children, className = "" }) {

function SectionHeading({ title, subtitle }) {

    </div>
  );
}

function useCountdown(targetDateStr) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);
  const target = new Date(targetDateStr + "T00:00:00").getTime();
  const diff = target - now;
  const totalSeconds = Math.max(0, Math.floor(diff / 1000));
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  return { days, hours, passed: diff < 0 };
}
